name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      game_version:
        description: Vintage Story version to build against
        required: false
        default: "1.22.7"

permissions:
  contents: read

jobs:
  verify:
    name: Verify release packages
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
    with:
      game_version: ${{ inputs.game_version || '1.22.7' }}

  publish:
    name: Publish verified tag
    needs: verify
    # A manual branch build verifies and uploads artifacts, but cannot publish.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Check framework version matches tag
        run: |
          tag="${GITHUB_REF_NAME#v}"
          mod=$(jq -r .version questline/modinfo.json)
          if [ "$tag" != "$mod" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match modinfo.json version $mod"
            exit 1
          fi
      - name: Download verified packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: questline-packages
          path: Releases
      - name: Download build inputs and test evidence
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: questline-test-results
          path: test-results
      - name: Recheck downloaded checksums
        run: |
          test "$(find Releases -maxdepth 1 -name '*.zip' -type f | wc -l)" -eq 15
          test "$(wc -l < Releases/SHA256SUMS)" -eq 15
          (cd Releases && sha256sum --check SHA256SUMS)
      - name: Attest all package provenance
        uses: actions/attest-build-provenance@8beda2b7ed98355c0e97c0a63bec38ae472e66c4 # v4
        with:
          subject-path: Releases/*.zip
      - name: Publish every package and checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=$(mktemp)
          {
            printf 'Built by GitHub Actions from `%s`.\n\n' "$GITHUB_SHA"
            printf 'Includes the framework, 13 independent content packs, and optional Toolsmith adapter.\n'
            printf 'Install only the packages you need; preserve the individual ZIPs.\n\n'
            printf '### Build inputs\n\n```text\n'
            cat test-results/build-environment.txt
            printf '```\n\n### SHA-256 checksums\n\n```text\n'
            cat Releases/SHA256SUMS
            printf '```\n\nVerify any ZIP with `gh attestation verify <package.zip> --repo %s`.\n' "$GITHUB_REPOSITORY"
            printf '\nOffline automated suites passed. Native VsTestkit and real-provider/world acceptance are separate manual gates; this release does not claim they ran.\n'
          } > "$notes"
          gh release create "$GITHUB_REF_NAME" Releases/*.zip Releases/SHA256SUMS \
            --verify-tag --target "$GITHUB_SHA" \
            --title "$GITHUB_REF_NAME" --notes-file "$notes"
      - name: Verify published assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" --json assets,isDraft > release.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          release = json.loads(Path('release.json').read_text())
          expected = {p.name for p in Path('Releases').iterdir() if p.is_file()}
          assert not release['isDraft'], release
          assert {a['name'] for a in release['assets']} == expected, release
          assert len(release['assets']) == 16, release
          PY
          published=$(mktemp -d)
          gh release download "$GITHUB_REF_NAME" --dir "$published" --pattern '*.zip' --pattern SHA256SUMS
          (cd "$published" && sha256sum --check SHA256SUMS)
          cmp Releases/SHA256SUMS "$published/SHA256SUMS"
