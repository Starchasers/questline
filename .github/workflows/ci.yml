name: Modular verification

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:
  workflow_call:
    inputs:
      game_version:
        type: string
        default: "1.22.7"
        description: Vintage Story version to compile against

permissions:
  contents: read

concurrency:
  group: modular-verification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Build and offline suites
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    env:
      GAME_VERSION: ${{ inputs.game_version || '1.22.7' }}
      DOTNET_VERSION: "10.0.302"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # Content provenance tests read the pinned upstream Git blobs.
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Fetch official game SDK
        run: |
          set -euo pipefail
          mkdir -p test-results
          # Preserve the upstream stable server download convention. Never accept
          # shell syntax or path components through workflow_call inputs.
          [[ "$GAME_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          tarball="vs_server_linux-x64_${GAME_VERSION}.tar.gz"
          curl --fail --show-error --location --retry 3 \
            --output "$tarball" "https://cdn.vintagestory.at/gamefiles/stable/${tarball}"
          mkdir -p game && tar xzf "$tarball" -C game
          echo "VINTAGE_STORY=$PWD/game" >> "$GITHUB_ENV"
          {
            printf 'Commit: %s\nVintage Story: %s\n' "$GITHUB_SHA" "$GAME_VERSION"
            printf '.NET SDK: %s\nPython: %s\n' "$(dotnet --version)" "$(python3 --version)"
            sha256sum "$tarball"
          } | tee test-results/build-environment.txt

      - name: Packaging regression suite
        run: python3 -m unittest discover -s tools/packaging -v 2>&1 | tee test-results/packaging.log
      - name: Content extraction regression suite
        run: python3 -m unittest discover -s tests -p 'test_content_extraction.py' -v 2>&1 | tee test-results/content.log
      - name: Livestock Welfare content contracts
        run: python3 -m unittest discover -s tests -p 'test_livestockwelfare.py' -v 2>&1 | tee test-results/livestockwelfare.log
      - name: Translation consistency
        run: python3 tools/lang/check.py 2>&1 | tee test-results/translations.log
      - name: Toolsmith source regression suite
        run: python3 compat/toolsmith/tests/regression.py 2>&1 | tee test-results/toolsmith-source.log
      - name: Build every owned package
        run: sh ./build.sh 2>&1 | tee test-results/build.log
      - name: Real-loader composition suite
        run: dotnet run --project verification/composition/CompositionTests.csproj -c Release -p:VINTAGE_STORY="$VINTAGE_STORY" 2>&1 | tee test-results/composition.log
      - name: Headless reward claim suite
        run: dotnet run --project verification/rewards/RewardTests.csproj -c Release -p:VINTAGE_STORY="$VINTAGE_STORY" 2>&1 | tee test-results/rewards.log
      - name: Synthetic Toolsmith adapter suite
        run: dotnet run --project compat/toolsmith/tests/AdapterChecks.csproj -c Release -p:VINTAGE_STORY="$VINTAGE_STORY" 2>&1 | tee test-results/toolsmith-adapter.log

      - name: Verify complete package set and checksums
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          manifests = [Path('questline/modinfo.json')]
          manifests += sorted(Path('content').glob('*/modinfo.json'))
          manifests += sorted(Path('compat').glob('*/modinfo.json'))
          expected = set()
          for manifest in manifests:
              info = json.loads(manifest.read_text())
              expected.add(f"{info['modid']}_{info['version']}.zip")
          actual = {p.name for p in Path('Releases').glob('*.zip')}
          assert len(manifests) == len(expected) == len(json.loads(Path('docs/content-packages.json').read_text())['packages']) + 2, (len(manifests), expected)
          assert actual == expected, (actual - expected, expected - actual)
          sums = Path('Releases/SHA256SUMS').read_text().splitlines()
          assert len(sums) == len(expected), sums
          assert {line.split('  ', 1)[1] for line in sums} == expected, sums
          print(f'Verified all {len(actual)} independent package names and checksum entries.')
          PY
          (cd Releases && sha256sum --check SHA256SUMS) | tee test-results/checksums.log
          {
            echo '### Modular verification'
            echo 'Built and checked 14 independent ZIPs (core, 12 content packs, Toolsmith adapter).'
            echo 'Offline suites do not replace native VsTestkit / real-world acceptance gates.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload all installable packages and checksums
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: questline-packages
          path: |
            Releases/*.zip
            Releases/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
      - name: Upload test logs and build inputs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: questline-test-results
          path: test-results/
          if-no-files-found: warn
          retention-days: 14
